<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário tipo instagram</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Instagram Login</h1>

    <form>

        <label>Nome Completo</label>
        <input type="text" placeholder="Digite seu nome">

        <label>Email</label>
        <input type="email" placeholder="Digite seu email">

        <label>Senha</label>
        <input type="password" placeholder="Digite sua senha">

        <label>Telefone</label>
        <input type="tel" placeholder="(11) 99999-9999">

        <label>Data de Nascimento</label>
        <input type="date">

        <label>Foto de Perfil</label>
        <input type="file">

        <label>Cor favorita do perfil</label>
        <input type="color">

        <label>Nível de fama</label>
        <input type="range" min="0" max="100">

        <div class="radio-group">
            <label>Conta:</label>

            <input type="radio" name="conta"> Pública
            <input type="radio" name="conta"> Privada
        </div>

        <div class="check-group">
            <label>Interesses:</label>

            <input type="checkbox"> Música
            <input type="checkbox"> Games
            <input type="checkbox"> Fotos
        </div>

        <label>Pesquisar Influenciador</label>
        <input type="search" placeholder="Pesquisar">

        <label>Site pessoal</label>
        <input type="url" placeholder="https://">

        <label>Horário favorito para postar</label>
        <input type="time">

        <label>Mês favorito</label>
        <input type="month">

        <label>Semana favorita</label>
        <input type="week">

        <input type="hidden" value="instagram">

        <div class="buttons">
            <input type="submit" value="Entrar">
            <input type="reset" value="Limpar">
        </div>

    </form>

</div>

</body>
</html>
